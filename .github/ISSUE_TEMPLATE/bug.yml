name: Bug report
description: Report a reproducible problem in the local app or synthetic demo.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove subscription IDs, resource IDs, secrets, and personal data before submitting.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Use the synthetic fixture whenever possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Go version, Node version, browser
    validations:
      required: true
