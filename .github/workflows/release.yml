name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Validate release tag and source revision
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be a stable semantic version: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./web/package.json').version")"
          lock_version="$(node -p "require('./web/package-lock.json').version")"
          if [[ "$package_version" != "$version" || "$lock_version" != "$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match web package versions ($package_version / $lock_version)." >&2
            exit 1
          fi
          if [[ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]]; then
            echo "Release tags must point at the current origin/main commit." >&2
            exit 1
          fi
      - name: Install frontend dependencies
        working-directory: web
        run: npm ci
      - name: Verify identity guards
        run: |
          ./scripts/check-forbidden-identity.sh --all
          ./scripts/test-git-guards.sh
      - name: Verify Go modules
        run: go mod verify
      - name: Test Go with race detector
        run: go test -race . ./cmd/... ./internal/...
      - name: Vet Go
        run: go vet . ./cmd/... ./internal/...
      - name: Scan Go dependencies and call paths
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 . ./cmd/... ./internal/...
      - name: Lint and test frontend
        run: |
          npm --prefix web run lint
          npm --prefix web test
          npm --prefix web audit --audit-level=high
      - name: Build and budget public dashboard
        run: |
          npm --prefix web run build
          ./scripts/check-bundle-budgets.sh web/dist
      - name: End-to-end test public dashboard
        run: |
          npm --prefix web exec -- playwright install --with-deps chromium
          npm --prefix web run test:e2e
      - name: Build embedded dashboard
        working-directory: web
        run: npm run build:embed
      - name: Verify generated assets and notices
        run: |
          ./scripts/check-embedded-assets.sh
          ./scripts/generate-go-licenses.sh
          git diff --exit-code -- demo/GO_THIRD_PARTY_LICENSES.txt internal/server/webdist
      - name: Smoke test standalone application
        run: |
          go build -trimpath -o "$RUNNER_TEMP/atlas" ./cmd/atlas
          ./scripts/smoke-standalone.sh "$RUNNER_TEMP/atlas"
      - name: Build portable archives
        run: ./scripts/build-release.sh "$GITHUB_REF_NAME" "$RUNNER_TEMP/releases"
      - name: Upload verified release archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/releases/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: ${{ runner.temp }}/releases
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/releases/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
