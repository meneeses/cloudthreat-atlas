name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  identity:
    name: Identity safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reject accidental company attribution
        run: ./scripts/check-forbidden-identity.sh --all
      - name: Test identity guards
        run: ./scripts/test-git-guards.sh
      - name: Validate release scripts
        run: bash -n scripts/build-release.sh scripts/check-bundle-budgets.sh

  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify modules
        run: go mod verify
      - name: Test with race detector
        run: go test -race . ./cmd/... ./internal/...
      - name: Vet
        run: go vet . ./cmd/... ./internal/...
      - name: Build CLI
        run: go build -trimpath -o "$RUNNER_TEMP/atlas" ./cmd/atlas
      - name: Smoke test standalone demo
        run: ./scripts/smoke-standalone.sh "$RUNNER_TEMP/atlas"
      - name: Verify Go dependency notices
        run: |
          ./scripts/generate-go-licenses.sh
          git diff --exit-code -- demo/GO_THIRD_PARTY_LICENSES.txt
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 . ./cmd/... ./internal/...

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Test
        working-directory: web
        run: npm test
      - name: Audit dependencies
        working-directory: web
        run: npm audit --audit-level=high
      - name: Build
        working-directory: web
        run: npm run build
      - name: Enforce bundle budgets
        run: ./scripts/check-bundle-budgets.sh web/dist
      - name: Install Playwright browser
        working-directory: web
        run: npx --no-install playwright install --with-deps chromium
      - name: End-to-end test
        working-directory: web
        run: npm run test:e2e
      - name: Build local API mode
        working-directory: web
        run: npm run build:api
      - name: Rebuild embedded dashboard
        working-directory: web
        run: npm run build:embed
      - name: Verify embedded dashboard is current
        run: ./scripts/check-embedded-assets.sh
